<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="100%" role="img">
  <title>星禾口语数据流图</title>
  <desc>老师发来的本地音视频文件经浏览器导入后，在本机内组织、播放、记录进度，全程不出网</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <text x="340" y="40" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">星禾口语 · 数据流：数据从哪来、到哪去</text>
  <text x="230" y="70" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">① 导入：复制一份进应用存储（统一复制）</text>
  <text x="435" y="70" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#5F5E5A">③ 播放</text>
  <rect x="40" y="82" width="150" height="62" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text x="115" y="104" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#444441">老师发来的素材</text>
  <text x="115" y="124" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#888780">硬盘上的 mp3·mp4</text>
  <line x1="192" y1="113" x2="266" y2="113" stroke="#185FA5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="270" y="82" width="150" height="62" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
  <text x="345" y="104" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#0C447C">星禾口语（前端）</text>
  <text x="345" y="124" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#185FA5">导入·整理·播放</text>
  <line x1="422" y1="113" x2="496" y2="113" stroke="#3B6D11" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="500" y="82" width="140" height="62" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.5"/>
  <text x="570" y="104" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#27500A">播放画面与声音</text>
  <text x="570" y="124" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#3B6D11">您看到、听到的</text>
  <line x1="345" y1="150" x2="345" y2="204" stroke="#0F6E56" stroke-width="1.5" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="360" y="182" font-family="sans-serif" font-size="12" fill="#5F5E5A">② 存 / 取：素材副本、文件夹结构、播放进度</text>
  <rect x="270" y="210" width="150" height="62" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
  <text x="345" y="232" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="500" fill="#085041">浏览器迷你数据库</text>
  <text x="345" y="252" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#0F6E56">素材副本·结构·进度</text>
  <rect x="40" y="288" width="600" height="24" rx="12" fill="#FCEBEB" stroke="#A32D2D" stroke-width="0.5" stroke-dasharray="4 3"/>
  <text x="340" y="300" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#A32D2D">数据不出网：素材与记录全程留在本机，断网可用（PRD A8）</text>
</svg>
