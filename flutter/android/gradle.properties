# 内存：给 4G 足够（8G 反而可能触发系统内存压力）
# 显式 UTF-8 编码，避免中文 Windows 的 GBK 导致构建产物解析乱码卡死
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -Dfile.encoding=UTF-8 -Duser.language=en -Duser.country=US
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# 关闭并行编译：中文 Windows 下并行编译第三方插件的字节码变换易卡死/竞态，
# 单线程虽慢但稳定，首次构建优先保证跑通
org.gradle.parallel=false
# 关闭按需配置，让 Gradle 一次性解析所有模块，减少懒加载带来的竞态
org.gradle.configureondemand=false
# 关闭 Kotlin 增量编译：中文 Windows 路径下 Kotlin 增量编译读写缓存(source-to-output.tab)
# 会死锁卡住 file_picker 等插件的 compileDebugKotlin，改为全量编译绕过
kotlin.incremental=false
